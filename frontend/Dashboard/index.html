  <!-- React 18, ReactDOM 18, Recharts 2, and Babel Standalone for Standalone Execution -->

  <style>
    body {
      background-color: #090C10;
      color: #E5E7EB;
      font-family: 'Inter', sans-serif;
      margin: 0;
      padding: 0;
      overflow-x: hidden;
    }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #090C10; }
    ::-webkit-scrollbar-thumb { background: #161B26; border-radius: 9999px; }
    ::-webkit-scrollbar-thumb:hover { background: #252D3D; }

    /* ── Entrance Animations ── */
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(18px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes fadeIn {
      from { opacity: 0; }
      to   { opacity: 1; }
    }
    @keyframes shimmerGlow {
      0%,100% { box-shadow: 0 0 0 0 rgba(0,180,216,0); }
      50%      { box-shadow: 0 0 18px 3px rgba(0,180,216,0.18); }
    }
    @keyframes pulseRing {
      0%   { transform: scale(1);   opacity: 1; }
      70%  { transform: scale(1.55); opacity: 0; }
      100% { transform: scale(1);   opacity: 0; }
    }
    @keyframes slideInRight {
      from { opacity: 0; transform: translateX(32px); }
      to   { opacity: 1; transform: translateX(0); }
    }
    @keyframes barGrow {
      from { width: 0 !important; }
    }

    /* ── Section entrance stagger ── */
    .anim-section { animation: fadeInUp 0.45s cubic-bezier(.22,1,.36,1) both; }
    .anim-section:nth-child(1) { animation-delay: 0.04s; }
    .anim-section:nth-child(2) { animation-delay: 0.12s; }
    .anim-section:nth-child(3) { animation-delay: 0.20s; }
    .anim-section:nth-child(4) { animation-delay: 0.28s; }
    .anim-section:nth-child(5) { animation-delay: 0.36s; }
    .anim-section:nth-child(6) { animation-delay: 0.42s; }
    .anim-section:nth-child(7) { animation-delay: 0.48s; }
    .anim-section:nth-child(8) { animation-delay: 0.54s; }

    /* ── KPI card hover ── */
    .kpi-card {
      transition: background-color 0.25s ease, box-shadow 0.25s ease, transform 0.25s cubic-bezier(.22,1,.36,1);
    }
    .kpi-card:hover {
      background-color: #101620 !important;
      transform: translateY(-2px);
      box-shadow: 0 8px 28px rgba(0,0,0,0.45);
    }

    /* ── Bar row hover ── */
    .bar-row {
      transition: background-color 0.2s ease, transform 0.2s cubic-bezier(.22,1,.36,1), box-shadow 0.2s ease;
    }
    .bar-row:hover {
      transform: translateX(3px);
      box-shadow: inset 3px 0 0 0 rgba(0,180,216,0.6);
    }

    /* ── Table row hover ── */
    .tbl-row {
      transition: background-color 0.2s ease, box-shadow 0.2s ease;
    }
    .tbl-row:hover {
      background-color: #111a2a !important;
      box-shadow: inset 3px 0 0 0 rgba(0,180,216,0.5);
    }
    .tbl-row.tbl-selected {
      background-color: #141B26;
      box-shadow: inset 3px 0 0 0 #00B4D8;
    }

    /* ── Telemetry card hover ── */
    .telemetry-card {
      transition: background-color 0.22s ease, border-color 0.22s ease, transform 0.22s cubic-bezier(.22,1,.36,1), box-shadow 0.22s ease;
    }
    .telemetry-card:hover {
      background-color: #131b2a !important;
      border-color: #2A3A56 !important;
      transform: translateY(-3px);
      box-shadow: 0 10px 28px rgba(0,0,0,0.5);
    }

    /* ── SHAP row hover ── */
    .shap-row {
      border-radius: 8px;
      transition: background-color 0.18s ease;
    }
    .shap-row:hover {
      background-color: #0F1520;
    }

    /* ── Dock action button hover ── */
    .dock-action {
      transition: color 0.18s ease, background-color 0.18s ease, transform 0.2s cubic-bezier(.22,1,.36,1), box-shadow 0.2s ease;
    }
    .dock-action:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 16px rgba(0,180,216,0.22);
      color: #38BDF8 !important;
    }

    /* ── Button polish ── */
    .btn-primary {
      transition: background-color 0.2s ease, transform 0.18s ease, box-shadow 0.2s ease;
    }
    .btn-primary:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 18px rgba(0,180,216,0.3);
    }
    .btn-secondary {
      transition: background-color 0.2s ease, border-color 0.2s ease, transform 0.18s ease;
    }
    .btn-secondary:hover {
      transform: translateY(-1px);
      background-color: #1E283C;
      border-color: #2A3A56;
    }

    /* ── Donut legend row ── */
    .legend-row {
      transition: background-color 0.18s ease, transform 0.18s ease;
    }
    .legend-row:hover {
      background-color: #141C2A;
      transform: translateX(3px);
    }

    /* ── Alert card hover ── */
    .alert-card {
      transition: border-color 0.2s ease, transform 0.2s cubic-bezier(.22,1,.36,1);
    }
    .alert-card:hover {
      border-color: #2A3A56;
      transform: translateY(-2px);
    }

    /* ── Event row ── */
    .event-row {
      transition: background-color 0.18s ease, padding-left 0.2s ease;
    }
    .event-row:hover {
      background-color: #0F1520;
      padding-left: 8px;
    }

    /* ── Bar fill animation on mount ── */
    .bar-fill { animation: barGrow 0.7s cubic-bezier(.22,1,.36,1) both; }
  </style>
</head>

    // Deterministic Fleet Builder
    function createInitialFleet() {
      const fleet = [
        {
          equipmentId: 'PUMP-042',

          lastUpdated: '2 min ago',

        {
          equipmentId: 'MOTOR-018',
          name: 'Primary Drive Motor',
          failureRisk: 0.74,
          status: 'critical',
          priority: 'high',
          lastUpdated: '4 min ago',
          productionLine: 'Line 1 - Extrusion Unit',
          telemetry: { vibration: 3.91, temperature: 94.2, pressure: 110.0, rpm: 3100 }
        },
        {
          equipmentId: 'COMP-007',
          name: 'Air Compressor',
          failureRisk: 0.61,
          status: 'warning',
          priority: 'medium',
          lastUpdated: '8 min ago',
          productionLine: 'Line 3 - Pneumatics Central',

        },
        {
          equipmentId: 'FAN-031',
          name: 'Exhaust Ventilation Fan',
          failureRisk: 0.40,
          status: 'warning',
          priority: 'medium',
          lastUpdated: '12 min ago',
          productionLine: 'Line 4 - Thermal Extraction',
          telemetry: { vibration: 1.85, temperature: 62.5, pressure: 45.2, rpm: 920 }
        },
        {
          equipmentId: 'PUMP-011',
          name: 'Coolant Booster Pump',
          failureRisk: 0.15,
          status: 'healthy',
          priority: 'low',
          lastUpdated: '15 min ago',
          productionLine: 'Line 1 - Auxiliary Cooling',
          telemetry: { vibration: 0.82, temperature: 41.2, pressure: 62.0, rpm: 1450 }
        }
      ];

      // Add 5 more critical to reach exactly 7
      const moreCrit = [
        { id: 'TURB-002', name: 'Feedwater Turbine', risk: 0.81, line: 'Line 2 - High Pressure Feed' },
        { id: 'EXTR-014', name: 'Main Polymer Extruder', risk: 0.79, line: 'Line 1 - Extrusion Unit' },
        { id: 'BOIL-009', name: 'High-Pressure Boiler Pump', risk: 0.76, line: 'Line 2 - High Pressure Feed' },
        { id: 'GEAR-033', name: 'Heavy Drive Gearbox', risk: 0.73, line: 'Line 3 - Pneumatics Central' },
        { id: 'GEN-005', name: 'Auxiliary Generator Stator', risk: 0.71, line: 'Line 4 - Thermal Extraction' }
      ];
      moreCrit.forEach(c => fleet.push({
        equipmentId: c.id, name: c.name, failureRisk: c.risk, status: 'critical', priority: 'high',
        lastUpdated: '5 min ago', productionLine: c.line,
        telemetry: { vibration: 4.1, temperature: 86.0, pressure: 135.0, rpm: 1800 }
      }));

      // Add 15 more warning to reach exactly 17
      for (let i = 0; i < 15; i++) {
        fleet.push({
          equipmentId: `WRN-${101 + i}`,
          name: `Warning Subsystem #${i + 1}`,
          failureRisk: +(0.44 + (i * 0.016)).toFixed(2),
          status: 'warning',
          priority: 'medium',
          lastUpdated: `${10 + i} min ago`,
          productionLine: `Line ${(i % 4) + 1}`,
          telemetry: { vibration: 2.3, temperature: 68.0, pressure: 102.0, rpm: 1500 }
        });
      }

      // Add 103 more healthy to reach exactly 104
      for (let i = 0; i < 103; i++) {
        fleet.push({
          equipmentId: `HLT-${201 + i}`,
          name: `Auxiliary Node #${i + 1}`,
          failureRisk: +(0.08 + ((i % 25) * 0.01)).toFixed(2),
          status: 'healthy',
          priority: 'low',
          lastUpdated: `${20 + (i % 30)} min ago`,
          productionLine: `Line ${(i % 4) + 1}`,
          telemetry: { vibration: 0.7, temperature: 39.0, pressure: 65.0, rpm: 1200 }
        });
      }

      return fleet;
    }

    const SHAP_STORE = {
      'PUMP-042': {
        predictedRisk: 0.87, baseValue: 0.15,
        factors: [
          { feature: 'Vibration', reading: '4.82 mm/s', value: 0.42, dir: 'increase', label: 'pushes risk higher', text: '+0.42' },

          { feature: 'Current Imbalance', reading: '48.6 A', value: 0.12, dir: 'increase', label: 'pushes risk higher', text: '+0.12' },
          { feature: 'Cooling Fan RPM', reading: '3,100 RPM', value: -0.20, dir: 'decrease', label: 'reduces risk', text: '-0.20' }
        ]
      },
      'COMP-007': {
        predictedRisk: 0.61, baseValue: 0.15,
        factors: [
          { feature: 'Outlet Temp', reading: '76.0 °C', value: 0.31, dir: 'increase', label: 'pushes risk higher', text: '+0.31' },
          { feature: 'Interstage Pressure', reading: '115.3 PSI', value: 0.22, dir: 'increase', label: 'pushes risk higher', text: '+0.22' },
          { feature: 'Oil Viscosity', reading: 'Normal', value: -0.07, dir: 'decrease', label: 'reduces risk', text: '-0.07' }
        ]

    const AI_REC_STORE = {
      'PUMP-042': {
        diagnostic: 'Mechanical Bearing Degradation & Cavitation Imbalance',
        rec: 'Inspect vibration and temperature anomalies. Immediate bearing lubrication check advised. Reduce pump output by 15% to mitigate bearing race micro-fissuring.',
        priority: 'urgent'
      },
      'MOTOR-018': {
        diagnostic: 'Stator Winding Overheating & Phase Current Imbalance',
        rec: 'Thermal run-away risk detected. Dispatch electrical technician to check terminal connections and cooling airflow. Consider 20% throughput down-rate.',
        priority: 'high'
      },
      'COMP-007': {

    function OperationsDashboardShell() {
      const [fleet, setFleet] = useState(createInitialFleet);
      const [selectedEquipmentId, setSelectedEquipmentId] = useState('PUMP-042');
      const [statusFilter, setStatusFilter] = useState('All');
      const [timeframe, setTimeframe] = useState('24H');
      const [searchQuery, setSearchQuery] = useState('');
      const [isAlertsOpen, setIsAlertsOpen] = useState(false);
      const [alertsTab, setAlertsTab] = useState('active');
      const [activeNavTab, setActiveNavTab] = useState('overview');
      const [isSimulating, setIsSimulating] = useState(true);
      const [simSec, setSimSec] = useState(2);
      const [toastMessage, setToastMessage] = useState(null);

      const [alerts, setAlerts] = useState([
        {
          id: 'ALT-801', severity: 'critical', equipmentId: 'PUMP-042',
          message: 'Failure risk increased to 87%',
          recommendation: 'Inspect vibration and temperature anomalies. Immediate bearing lubrication check advised.',
          timestamp: '2 min ago', status: 'active', ackBy: null
        },
        {
          id: 'ALT-802', severity: 'critical', equipmentId: 'MOTOR-018',
          message: 'Thermal run-away risk detected (74%)',
          recommendation: 'Reduce extrusion throughput by 20% and dispatch electrical maintenance.',
          timestamp: '4 min ago', status: 'active', ackBy: null
        },
        {
          id: 'ALT-803', severity: 'warning', equipmentId: 'COMP-007',
          message: 'Pressure differential exceeds threshold (61%)',
          recommendation: 'Schedule air filter inspection during upcoming shift transition.',
          timestamp: '8 min ago', status: 'active', ackBy: null
        }
      ]);

      const [events, setEvents] = useState([
        { id: '1', time: '09:42:18', eq: 'PUMP-042', msg: 'Hydraulic Feed Pump failure risk increased to 87%', sev: 'critical' },
        { id: '2', time: '09:40:12', eq: 'MOTOR-018', msg: 'Primary Drive Motor thermal anomaly detected (94.2 °C)', sev: 'critical' },
        { id: '3', time: '09:37:05', eq: 'COMP-007', msg: 'Air Compressor differential pressure exceeded 115 PSI', sev: 'warning' },
        { id: '4', time: '09:31:44', eq: 'LINE-2', msg: 'Line 2 - High Pressure Feed telemetry synchronized', sev: 'info' }
      ]);

      const triggerToast = (msg) => {
        setToastMessage(msg);
        setTimeout(() => setToastMessage(null), 2800);
      };

      // Controlled Simulation Loop
      useEffect(() => {
        if (!isSimulating) return;
        const iv = setInterval(() => {
          setSimSec(s => s >= 60 ? 2 : s + 3);
          setFleet(prev => {
            const list = [...prev];
            const target = list.find(e => e.equipmentId === 'PUMP-042') || list[0];
            const drift = (Math.random() - 0.48) * 0.01;
            target.failureRisk = +(Math.min(Math.max(target.failureRisk + drift, 0.82), 0.94)).toFixed(2);
            target.telemetry.vibration = +(target.telemetry.vibration + (drift * 2)).toFixed(2);
            return list;
          });
        }, 3500);
        return () => clearInterval(iv);
      }, [isSimulating]);

      // Derived Metrics
      const totalCount = fleet.length; // 128
      const healthyCount = fleet.filter(e => e.status === 'healthy').length;
      const warningCount = fleet.filter(e => e.status === 'warning').length;
      const criticalCount = fleet.filter(e => e.status === 'critical').length;
      const healthyPct = ((healthyCount / totalCount) * 100).toFixed(1);

      const activeAlertsCount = alerts.filter(a => a.status === 'active').length;

                </div>
                <div className="flex items-center gap-5 text-[12px]">
                  <div className="flex items-center gap-1.5"><Icons.TrendingUp /><span className="text-[#9CA3AF]">Increases risk</span></div>
                  <div className="flex items-center gap-1.5"><Icons.TrendingDown /><span className="text-[#9CA3AF]">Reduces risk</span></div>
                </div>
              </div>

              <div className="pt-4 pb-3 flex items-center justify-between text-[12px] border-b border-[#141A24]">
                <div className="text-[#6B7280]">Base Population Risk: <span className="text-slate-300 font-mono">15%</span></div>
                <div className="text-[#6B7280]">Model Predicted Risk: <span className="text-white font-bold font-mono text-[13px]">{Math.round(selectedEquipment.failureRisk * 100)}%</span></div>
              </div>

              <div className="space-y-2 pt-4">
                {currentShap.factors.map((f, idx) => {
                  const isInc = f.dir === 'increase';
                  const barW = Math.min(Math.round((Math.abs(f.value) / 0.5) * 82), 85);
                  return (
                    <div key={idx} className="shap-row flex flex-col sm:flex-row sm:items-center gap-2 sm:gap-4 py-2 px-2">
                      <div className="w-44 text-[13px] text-[#9CA3AF]">
                        <span className="text-white font-medium">{f.feature}</span>
                        <span className="block text-[11px] text-[#6B7280] font-mono">{f.reading}</span>
                      </div>
                      <div className="flex-1 h-7 rounded-[3px] bg-[#0E131C] relative overflow-hidden flex items-center">
                        <div
                          className={`bar-fill h-full rounded-[3px] flex items-center px-3 transition-all duration-700 ease-out ${isInc ? 'bg-[#B84343]' : 'bg-[#0E8388]'}`}
                          style={{ width: `${Math.max(barW, 24)}%` }}
                        >
                          <span className="text-[11px] font-normal text-white/90 whitespace-nowrap">{f.label}</span>
                        </div>
                      </div>
                      <div className={`w-16 text-right font-bold text-[13px] font-mono ${isInc ? 'text-[#E05252]' : 'text-[#00B4D8]'}`}>
                        {f.text}
                      </div>
                    </div>
                  );
                })}
              </div>
            </section>

            {/* 7. AI MAINTENANCE INSIGHT */}
            <section className="anim-section bg-[#0D1117] border border-[#161B26] rounded-xl p-6 shadow-xl">
              <div className="flex items-center justify-between pb-4 border-b border-[#141A24]">
                <div className="flex items-center gap-3">
                  <div className="p-1.5 rounded-md bg-[#0F2232] text-[#38BDF8] border border-[#164157]"><Icons.ShieldCheck /></div>
                  <div>
                    <h3 className="text-[15px] font-semibold text-white tracking-tight">AI Maintenance Insight</h3>
                    <p className="text-[11px] text-[#6B7280]">Automated diagnosis & remedial triage via Agentic AI - Afreen</p>
                  </div>
                </div>
                <span className="text-[10px] font-bold uppercase tracking-wider px-2.5 py-1 rounded bg-[#2D1619] text-[#EF4444] border border-[#521E24]">
                  {currentAiRec.priority}
                </span>
              </div>

              <div className="pt-4 space-y-3">
                <div className="text-[13px] font-bold text-white">"{currentAiRec.diagnostic}"</div>
                <div className="text-[12px] text-[#9CA3AF] leading-relaxed bg-[#090C10] p-3.5 rounded-lg border border-[#141A24]">
                  <span className="text-white font-medium">Recommendation: </span>{currentAiRec.rec}
                </div>
                <div className="flex items-center justify-end gap-3 pt-2">
                  <button onClick={() => triggerToast('Work order created for ' + selectedEquipment.equipmentId + '.')} className="btn-secondary px-3.5 py-1.5 rounded-lg bg-[#141C2A] text-slate-200 text-[12px] font-medium border border-[#212C42]">Create Work Order</button>
                  <button onClick={() => triggerToast('Technician dispatched to ' + selectedEquipment.productionLine + '.')} className="btn-primary px-3.5 py-1.5 rounded-lg bg-[#00B4D8] hover:bg-[#0096B4] text-slate-950 text-[12px] font-bold">Dispatch Technician</button>
                </div>
              </div>
            </section>

            {/* 8. LIVE OPERATIONAL EVENT STREAM */}
            <section className="anim-section bg-[#0D1117] border border-[#161B26] rounded-xl p-6 shadow-xl">
              <div className="flex items-center justify-between pb-4 border-b border-[#141A24]">
                <div>
                  <h3 className="text-[15px] font-semibold text-white tracking-tight">Live Operational Event Stream</h3>
                  <p className="text-[11px] text-[#6B7280]">Telemetry anomaly detection & automated incident transitions</p>
                </div>
                <span className="text-[11px] text-[#6B7280] font-mono">{events.length} logged</span>
              </div>
              <div className="divide-y divide-[#141924] pt-2">
                {events.map(evt => (
                  <div key={evt.id} className="event-row py-2.5 flex items-center justify-between gap-4 text-[12px] rounded px-1">
                    <div className="flex items-center gap-3">
                      <span className="text-[11px] font-mono text-[#6B7280] w-16">{evt.time}</span>
                      <span className={`w-1.5 h-1.5 rounded-full ${evt.sev === 'critical' ? 'bg-[#EF4444]' : evt.sev === 'warning' ? 'bg-[#EAB308]' : 'bg-[#00B4D8]'}`}></span>
                      <span className="text-slate-300">{evt.msg}</span>
                    </div>
                    <span className="text-[11px] font-mono text-[#6B7280] hidden sm:inline">{evt.eq}</span>
                  </div>
                ))}
              </div>
            </section>

          </main>

          {/* ALERT DRAWER */}
          {isAlertsOpen && (
            <div className="fixed inset-0 z-50 overflow-hidden">
              <div onClick={() => setIsAlertsOpen(false)} className="absolute inset-0 bg-black/70 backdrop-blur-sm" />
              <div className="fixed inset-y-0 right-0 max-w-full flex pl-10">
                <div className="w-screen max-w-md bg-[#0D1117] border-l border-[#1A202C] shadow-2xl flex flex-col">
                  <div className="p-5 border-b border-[#161B26] flex items-center justify-between">
                    <div className="flex items-center gap-2.5">
                      <div className="p-1.5 rounded-md bg-[#2D1619] text-[#EF4444]"><Icons.Bell /></div>
                      <div>
                        <h3 className="text-sm font-bold text-white">Active AI Triage Alerts</h3>
                        <p className="text-[11px] text-[#6B7280]">Incident triage & lifecycle management</p>
                      </div>
                    </div>
                    <button onClick={() => setIsAlertsOpen(false)} className="p-1.5 text-[#6B7280] hover:text-white"><Icons.Close /></button>
                  </div>

                  <div className="flex items-center border-b border-[#161B26] px-5 text-[12px]">
                    {[
                      { id: 'active', label: `Active (${alerts.filter(a => a.status === 'active').length})` },
                      { id: 'acknowledged', label: `Acknowledged (${alerts.filter(a => a.status === 'acknowledged').length})` },
                      { id: 'resolved', label: `Resolved (${alerts.filter(a => a.status === 'resolved').length})` }
                    ].map(tab => (
                      <button
                        key={tab.id} onClick={() => setAlertsTab(tab.id)}
                        className={`py-3 px-3 font-medium transition border-b-2 ${
                          alertsTab === tab.id ? 'border-[#00B4D8] text-white font-semibold' : 'border-transparent text-[#6B7280] hover:text-slate-200'
                        }`}
                      >{tab.label}</button>
                    ))}
                  </div>

                  <div className="flex-1 overflow-y-auto p-5 space-y-3.5">
                    {visibleAlerts.length === 0 ? (
                      <div className="py-16 text-center text-xs text-[#6B7280]">No alerts under <span className="text-white capitalize">{alertsTab}</span> status.</div>
                    ) : (
                      visibleAlerts.map(alert => (
                        <div key={alert.id} className={`p-4 rounded-xl border space-y-2.5 ${alert.status === 'active' ? 'bg-[#111620] border-[#1A2130]' : 'bg-[#0E131C] border-[#161C28] opacity-80'}`}>
                          <div className="flex items-center justify-between">
                            <span className="text-[12px] font-semibold text-[#00B4D8] font-mono">{alert.equipmentId}</span>
                            <span className={`text-[10px] font-bold uppercase tracking-wider px-2 py-0.5 rounded ${
                              alert.severity === 'critical' ? 'bg-[#2D1619] text-[#EF4444]' : 'bg-[#2A1F14] text-[#EAB308]'
                            }`}>{alert.severity}</span>
                          </div>
                          <div className="text-[13px] font-semibold text-white">{alert.message}</div>
                          <div className="text-[12px] text-[#9CA3AF] bg-[#090C10] p-2.5 rounded-lg border border-[#141A24]">
                            <span className="text-[#D1D5DB] font-medium">Recommendation: </span>{alert.recommendation}
                          </div>
                          {alert.ackBy && <div className="text-[11px] text-[#34D399] font-mono">✓ Acknowledged by {alert.ackBy}</div>}
                          <div className="flex items-center justify-between pt-2">
                            <span className="text-[11px] text-[#6B7280] font-mono">{alert.timestamp}</span>
                            <div className="flex items-center gap-2">
                              {alert.status === 'active' && (
                                <button onClick={() => handleAcknowledgeAlert(alert.id)} className="px-2.5 py-1 rounded bg-[#D94C4C] hover:bg-[#E05252] text-white text-[11px] font-semibold">Acknowledge</button>
                              )}
                              {alert.status === 'acknowledged' && (
                                <button onClick={() => handleResolveAlert(alert.id)} className="px-2.5 py-1 rounded bg-[#22C55E] hover:bg-[#16A34A] text-slate-950 text-[11px] font-bold">Resolve</button>
                              )}
                            </div>
                          </div>
                        </div>
                      ))
                    )}
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* FLOATING BOTTOM DOCK */}
          <footer className="fixed bottom-4 inset-x-0 z-40 flex justify-center pointer-events-none px-4">
            <div className="pointer-events-auto bg-[#0E131C]/95 backdrop-blur-md border border-[#1D2536] shadow-2xl rounded-xl px-4 py-2 flex items-center gap-1 text-[12px]">

              {/* Nav tabs */}
              <button onClick={() => { setActiveNavTab('overview'); window.scrollTo({ top: 0, behavior: 'smooth' }); }}
                className={`dock-action flex flex-col items-center gap-1 px-3 py-1.5 rounded-lg ${
                  activeNavTab === 'overview' ? 'text-[#00B4D8] bg-[#101826]' : 'text-[#6B7280] hover:bg-[#101826]'
                }`}>
                <Icons.OverviewGrid /><span className="text-[10px] font-medium">Overview</span>
              </button>

              <button onClick={() => { setActiveNavTab('equipment'); triggerToast('128 production assets online · 4 lines active.'); }}
                className={`dock-action flex flex-col items-center gap-1 px-3 py-1.5 rounded-lg ${
                  activeNavTab === 'equipment' ? 'text-[#00B4D8] bg-[#101826]' : 'text-[#6B7280] hover:bg-[#101826]'
                }`}>
                <Icons.Nodes /><span className="text-[10px] font-medium">Equipment</span>
              </button>

              <button onClick={() => setIsAlertsOpen(true)}
                className={`dock-action flex flex-col items-center gap-1 px-3 py-1.5 rounded-lg relative ${
                  activeNavTab === 'alerts' ? 'text-[#00B4D8] bg-[#101826]' : 'text-[#6B7280] hover:bg-[#101826]'
                }`}>
                <Icons.Bell /><span className="text-[10px] font-medium">Alerts</span>
                {activeAlertsCount > 0 && <span className="absolute top-1 right-2 w-1.5 h-1.5 rounded-full bg-[#EF4444] animate-pulse"></span>}
              </button>

              <button onClick={() => { setActiveNavTab('maintenance'); triggerToast('Maintenance schedule synced · 4 lines.'); }}
                className={`dock-action flex flex-col items-center gap-1 px-3 py-1.5 rounded-lg ${
                  activeNavTab === 'maintenance' ? 'text-[#00B4D8] bg-[#101826]' : 'text-[#6B7280] hover:bg-[#101826]'
                }`}>
                <Icons.Wrench /><span className="text-[10px] font-medium">Maintenance</span>
              </button>

              {/* Divider */}
              <div className="w-px h-8 bg-[#1D2536] mx-1"></div>

              {/* Operator Quick Actions */}
              <button
                onClick={() => triggerToast('Fleet health report generated · PDF ready to download.')}
                className="dock-action flex flex-col items-center gap-1 px-3 py-1.5 rounded-lg text-[#6B7280] hover:bg-[#101826]"
                title="Export Fleet Report"
              >
                <svg className="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round">
                  <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/>
                </svg>
                <span className="text-[10px] font-medium">Export</span>
              </button>

              <button
                onClick={() => triggerToast('Maintenance window scheduled for ' + selectedEquipment.equipmentId + ' · Next shift.')}
                className="dock-action flex flex-col items-center gap-1 px-3 py-1.5 rounded-lg text-[#6B7280] hover:bg-[#101826]"
                title="Schedule Maintenance"
              >
                <svg className="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round">
                  <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/><line x1="12" y1="14" x2="12" y2="18"/><line x1="10" y1="16" x2="14" y2="16"/>
                </svg>
                <span className="text-[10px] font-medium">Schedule</span>
              </button>

              <button
                onClick={() => { triggerToast('Running AI diagnostics on ' + selectedEquipment.equipmentId + ' · ETA 8s…'); const el = document.getElementById('shap-section'); if (el) el.scrollIntoView({ behavior: 'smooth' }); }}
                className="dock-action flex flex-col items-center gap-1 px-3 py-1.5 rounded-lg text-[#6B7280] hover:bg-[#101826]"
                title="Run AI Diagnostics"
              >
                <svg className="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round">
                  <circle cx="12" cy="12" r="3"/><path d="M12 1v4M12 19v4M4.22 4.22l2.83 2.83M16.95 16.95l2.83 2.83M1 12h4M19 12h4M4.22 19.78l2.83-2.83M16.95 7.05l2.83-2.83"/>
                </svg>
                <span className="text-[10px] font-medium">Diagnose</span>
              </button>

              <button
                onClick={() => triggerToast('Full fleet telemetry snapshot saved · ' + new Date().toLocaleTimeString())}
                className="dock-action flex flex-col items-center gap-1 px-3 py-1.5 rounded-lg text-[#6B7280] hover:bg-[#101826]"
                title="Capture Fleet Snapshot"
              >
                <svg className="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round">
                  <path d="M23 7l-7-5-7 5v15l7-5 7 5z"/><line x1="9" y1="2" x2="9" y2="17"/><line x1="16" y1="7" x2="16" y2="22"/>
                </svg>
                <span className="text-[10px] font-medium">Snapshot</span>
              </button>

            </div>
          </footer>

          {/* TOAST */}
          {toastMessage && (
            <div style={{ animation: 'slideInRight 0.3s cubic-bezier(.22,1,.36,1) both' }}
              className="fixed top-20 right-6 z-50 bg-[#141B26] border border-[#00B4D8]/40 text-slate-100 text-[12px] px-4 py-2.5 rounded-xl shadow-2xl flex items-center gap-2.5">
              <span className="w-2 h-2 rounded-full bg-[#00B4D8] animate-pulse"></span>
              <span>{toastMessage}</span>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<OperationsDashboardShell />);
  </script>
</body>
</html>
